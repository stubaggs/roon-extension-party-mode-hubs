<!--
  The Party Hub with Roon's own display page (Roon Display) in place of what's
  playing: the room sees Roon's artist pictures and lyrics, and still the code
  to join, Up next and who asked for each track. In English only.

  Open this file in a browser (from any web server, or from disk) with the
  Party Hub's address and the Roon Core's added:
  roon-display-hub.html?hub=http://192.0.2.10:8338&roon=http://192.0.2.20:9330

  The Core's address is the one Roon gives for Roon Display (Settings →
  Displays), without /display/; Party Mode doesn't give it out. The first time,
  choose the zone in Roon's page, as on any display: it remembers it in this
  browser. Each browser showing this page appears in Roon's Displays.

  Roon's page takes the whole right-hand side, 16:15: Roon's picture fills the
  top 80% of its page, and that shape (4:3) is one Roon has an artist picture
  for; other shapes get a smaller picture with a blur around it. Until Roon's
  page answers, and on a phone, what's playing shows instead, as in
  party-hub.html. Roon's page loads its fonts from Google Fonts.

  In Firefox, open it from a web server rather than from disk: Firefox moves a
  page from disk's images to https, which Party Mode doesn't serve.

  What differs from the built-in Hub: there's no menu.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party Hub with Roon Display</title>
<style>
  /* From Party Mode's party.css and hub.css. */
  :root {
    --ink: #170f2b; --raised: #241740; --edge: #3a2a63; --text: #f0eaff; --muted: #a79bd0;
    --amber: #ffc24b; --lavender: #c9b6ff; --mint: #7be0c0; --sky: #8ccfff;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    /* Laid out for 1920 × 1080; a bigger screen grows everything with it. */
    font-size: max(100%, min(100vh / 67.5, 100vw / 120)); }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--text); font-family: var(--font); line-height: 1.45;
    -webkit-font-smoothing: antialiased; min-height: 100vh; overflow: hidden; height: 100vh; font-size: 1.0625rem; }
  [hidden] { display: none !important; }
  .art { background: var(--edge); border-radius: 6px; object-fit: cover; flex: none; }
  .muted { color: var(--muted); }

  .stage { display: grid; grid-template-columns: minmax(17.5rem, 34%) 1fr; grid-template-rows: auto minmax(0, 1fr);
    gap: clamp(1rem, 3vh, 2.5rem) clamp(1.5rem, 4vw, 4rem); height: 100vh;
    padding: clamp(1.5rem, 5vh, 4.5rem) clamp(1.5rem, 4vh, 3.5rem); align-items: center; }
  .join { grid-row: 1 / -1; align-self: stretch; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .join h1 { margin: 0 0 1.2rem; padding-inline: 1.5rem; font-size: clamp(1.6rem, 3vw, 2.6rem); font-weight: 800; letter-spacing: -0.03em; }
  .qr { width: min(100%, 30.5rem, 45vh); aspect-ratio: 1; background: #fff; border-radius: 18px; padding: 0.75rem; margin: 0 auto; display: block; }
  .join-copy { margin: 1rem 0 0.2rem; font-size: clamp(1rem, 1.6vw, 1.4rem); color: var(--amber); }
  .join-link { color: inherit; text-decoration: none; border-radius: 6px; }
  .join-link:hover { text-decoration: underline; }
  .download { display: inline-block; text-decoration: none; border-radius: 999px; font-weight: 650;
    font-size: clamp(1rem, 1.4vw, 1.25rem); padding: 0.8rem 1.6rem; background: var(--amber); color: #2a1c00; }

  .stack { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: clamp(1rem, 3vh, 2.5rem); }
  .closed-title { margin: 0; font-size: clamp(1.6rem, 4vw, 3.4rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; color: var(--amber); }
  .closed-text { margin: 0.4rem 0 1.2rem; font-size: clamp(1rem, 1.6vw, 1.4rem); }

  .current { display: flex; gap: clamp(1rem, 2vw, 2rem); align-items: flex-start; min-width: 0; }
  .current-art { width: clamp(6rem, 13vw, 12.5rem); height: clamp(6rem, 13vw, 12.5rem); border-radius: 10px;
    box-shadow: 0 0 5.6rem -1.25rem var(--amber); }
  .current-text { flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 1rem; }
  .current-text > * { grid-column: 1 / -1; }
  .current-text > .current-label { grid-column: 1; }
  .current-text > .current-who { grid-area: 1 / 2; justify-self: end; align-self: center; margin: 0; }
  .current-label { margin: 0 0 0.3rem; color: var(--amber); font-size: clamp(0.8rem, 1.1vw, 1rem); }
  .current-title { margin: 0; font-size: clamp(1.6rem, 4vw, 3.4rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .current-artist { margin: 0.35rem 0 0; font-size: clamp(1rem, 1.8vw, 1.6rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .current-album { margin: 0.2rem 0 0; font-size: clamp(0.9rem, 1.5vw, 1.3rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .current-note { margin: 0.6rem 0 0; font-size: clamp(0.9rem, 1.4vw, 1.2rem); max-width: 40ch; }
  .current-who { display: inline-block; margin: 0.8rem 0 0; padding: 0.1rem 0.6rem; border-radius: 999px;
    font-size: calc(0.6 * clamp(1rem, 1.6vw, 1.5rem)); background: rgba(201, 182, 255, 0.18); color: var(--lavender); }

  .upnext { grid-column: 2; align-self: stretch; min-height: 0; display: flex; flex-direction: column; }
  .upnext-title { margin: 0 0 0.6rem; color: var(--amber); font-size: clamp(0.8rem, 1.1vw, 1rem); font-weight: 600; }
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--edge); min-width: 0; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .list .empty { display: flex; align-items: center; justify-content: center; height: 100%; border-bottom: 0; text-align: center;
    font-size: clamp(1rem, 1.8vw, 1.6rem); }
  .list li { display: grid; grid-template-columns: 2.2rem auto 1fr; gap: 1rem; align-items: center;
    padding: clamp(0.4rem, 1.1vh, 0.9rem) 0; border-bottom: 1px solid rgba(58, 42, 99, 0.5); font-size: clamp(1rem, 1.6vw, 1.5rem); min-width: 0; }
  /* Only whole tracks (see the script): a screen can't scroll. */
  .list li[hidden] { display: none; }
  .list .cover { width: 2.4em; height: 2.4em; }
  .list .n { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 0.75em; }
  .list > li > div { min-width: 0; }
  .list .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 0.78em; }
  .list .who { display: inline-block; max-width: 100%; margin-top: 0.3rem; padding: 0.1rem 0.6rem; border-radius: 999px; font-size: 0.6em;
    background: rgba(201, 182, 255, 0.18); color: var(--lavender); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Lavender for a track a guest added, amber for Play next, mint for Roon Radio, sky for the host's. */
  .who.radio { background: rgba(123, 224, 192, 0.16); color: var(--mint); }
  .who.next { background: rgba(255, 194, 75, 0.16); color: var(--amber); }
  .who.host { background: rgba(140, 207, 255, 0.16); color: var(--sky); }

  @media (min-width: 721px) {
    .list > li > div { display: grid; grid-template-columns: minmax(0, max-content) max-content 1fr; align-items: baseline; column-gap: 0.9em; }
    .list .t { grid-area: 1 / 1; }
    .list .a { grid-area: 2 / 1 / auto / -1; width: 0; min-width: 100%; }
    .list .who { grid-area: 1 / 2; justify-self: start; margin-top: 0; }
  }
  @media (max-width: 720px) {
    body { overflow: auto; height: auto; }
    .stage { grid-template-columns: 1fr; grid-template-rows: none; height: auto; align-content: start; }
    .join { grid-row: auto; display: block; }
    .upnext { grid-column: auto; }
    .list { overflow: visible; }
    .current { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 1rem; align-items: center; }
    .current-text { display: contents; }
    .current-text > .current-label { grid-area: 1 / 1 / auto / -1; margin: 0 0 0.6rem; font-weight: 600; }
    .current-art { grid-column: 1; grid-row: 2 / span 3; }
    .current-title { grid-area: 2 / 2; }
    .current-artist { grid-area: 3 / 2; }
    .current-album { grid-area: 4 / 2; }
    .current-text > .current-who { grid-area: 1 / 2; align-self: start; }
    .qr { width: min(60%, 16rem); }
  }

  /* Long names scroll, twice, then stop (see the script). */
  .marquee-on { text-overflow: clip; }
  .marquee-inner { display: inline-block; animation: marquee var(--marquee-time, 8s) ease-in-out 4 alternate; }
  @keyframes marquee { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--marquee-shift, 0)); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* Roon's display page in place of what's playing, on the whole right-hand
     side: the code shrinks and Up next moves under it. The script marks the
     stage while the frame shows. */
  .stage.framed { grid-template-columns: minmax(17.5rem, 1fr) auto; align-items: start; }
  .stage.framed .join { grid-row: 1; align-self: start; }
  .stage.framed .qr { width: min(100%, 30.5rem, 30vh); }
  .stage.framed .stack { grid-column: 2; grid-row: 1 / -1; align-self: center; }
  .stage.framed .upnext { grid-column: 1; grid-row: 2; }
  /* As tall as the screen leaves (less the line above it), or as wide as
     leaves the code a usable column. */
  .frame { display: block; width: min(62vw, 100vw - 27rem, (100vh - 0.5rem - clamp(1.5rem, 4vh, 3.5rem) - 2.6rem) * 16 / 15);
    aspect-ratio: 16 / 15; border: 1px solid var(--edge); border-radius: 0.75rem; background: var(--raised); }
  /* Above the frame: "Playing now", and who asked for the track, which Roon's page can't know. */
  .frame-credit { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin: 0 0 0.6rem; }
  .frame-label { color: var(--amber); font-size: clamp(0.8rem, 1.1vw, 1rem); font-weight: 600; }
  .frame-credit .current-who { margin: 0; }

  /* Only until the addresses are given. */
  .setup { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink); padding: 16px; }
  .setup form { display: flex; flex-wrap: wrap; gap: 8px; width: min(36rem, 100%); }
  .setup label { flex: 1 1 100%; display: grid; gap: 4px; }
  .setup input { flex: 1; min-width: 0; padding: 0.6rem; font: inherit; border-radius: 8px; border: 1px solid var(--edge); }
  .setup button { padding: 0.6rem 1.2rem; font: inherit; font-weight: 650; border: 0; border-radius: 999px; background: var(--amber); color: #2a1c00; cursor: pointer; }
  .offline { position: fixed; bottom: 0.5rem; inset-inline-start: 0.75rem; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<div class="setup" id="setup" hidden>
  <form id="setup-form">
    <label>Party Hub address <input id="hub" type="url" placeholder="http://192.0.2.10:8338" required></label>
    <label>Roon Core address <input id="roon" type="url" placeholder="http://192.0.2.20:9330" required></label>
    <button>Show</button>
  </form>
</div>

<main class="stage">
  <section class="join">
    <h1 id="party-name">Party</h1>
    <div id="join-open">
      <img id="qr" class="qr" alt="QR code for the guest page" hidden>
      <p class="join-copy"><a class="join-link" id="join-copy" target="_blank" rel="noopener">Scan to add a track</a></p>
    </div>
    <div id="join-closed" hidden>
      <img id="playlist-qr" class="qr" alt="QR code for the playlist" hidden>
      <p class="join-copy" id="playlist-copy" hidden><a class="join-link" id="playlist-qr-link">Scan to download the playlist</a></p>
      <a class="download" id="playlist-link-offer" hidden>Download the playlist</a>
    </div>
  </section>

  <section class="stack">
    <div id="closed" hidden>
      <h2 class="closed-title">Requests are closed</h2>
      <p class="closed-text muted">Thanks for all the tracks.</p>
    </div>
    <div id="frame-slot" hidden>
      <p class="frame-credit"><span class="frame-label" id="frame-label">Playing now</span><span class="current-who" id="frame-who" hidden></span></p>
      <div id="frame-box"></div>
      <p class="current-note muted" id="frame-note" hidden>Waiting for the host to start the queue.</p>
    </div>
    <div class="current" id="current">
      <img class="art current-art" id="current-art" alt="">
      <div class="current-text">
        <p class="current-label" id="current-label">Playing now</p>
        <h2 class="current-title" id="current-title">Nothing playing</h2>
        <p class="current-artist muted" id="current-artist"></p>
        <p class="current-album muted" id="current-album" hidden></p>
        <p class="current-who" id="current-who" hidden></p>
        <p class="current-note muted" id="current-note" hidden>Waiting for the host to start the queue.</p>
      </div>
    </div>
  </section>

  <section class="upnext">
    <h2 class="upnext-title">Up next</h2>
    <ol class="list" id="list"></ol>
  </section>
</main>
<p class="offline" id="offline" hidden></p>

<script>
(function () {
  'use strict';
  const el = (id) => document.getElementById(id);
  let hub = null; // "http://192.0.2.10:8338"
  let display = null; // Roon's display page: "http://192.0.2.20:9330/display/"

  // ------------------------------------------------------------ the words
  // The built-in Hub's English. /embed/ gives kinds and reasons; the page words them.
  let hostName = null;
  const EMPTY = {
    none: 'Nothing lined up.',
    add: 'Nothing lined up. Add a track.',
    add_radio: 'Nothing lined up. Add a track, or leave it to Roon Radio.',
    radio: "Roon Radio picks what's next."
  };
  // In Up next: the name alone; beside the playing track: "Requested by …".
  function credit(c, long) {
    if (c.kind === 'radio') return 'Roon Radio';
    if (c.kind === 'host') return c.name || hostName || 'Host';
    const name = c.name || 'Anon';
    return long ? 'Requested by ' + name : name;
  }
  // Lavender for a guest's track, amber for Play next, mint for Roon Radio, sky for the host's.
  const creditClass = (c) => (c.kind === 'guest' ? (c.how === 'next' ? 'next' : '') : c.kind);
  const cover = (path, size) => (path ? hub + path + '?size=' + size : '');

  // --------------------------------------------------------------- status
  let party = null;
  function showStatus(s) {
    hostName = s.host_name;
    const name = s.party_name || 'Party';
    el('party-name').textContent = name;
    document.title = name + ' Hub';
    const over = s.party === 'off';
    el('join-open').hidden = over;
    el('join-closed').hidden = !over;
    el('join-copy').textContent = s.party === 'paused' ? 'Requests are paused for a moment.' : 'Scan to add a track';
    // With a link chosen, a button in the code's place.
    el('playlist-link-offer').hidden = !(over && s.playlist === 'link');
    if (s.party !== party) {
      party = s.party;
      // Loaded again with each change: a new party has a new code. Shown only once
      // loaded, as a cleared src can leave the last picture showing.
      const qr = over ? el('playlist-qr') : el('qr');
      for (const img of [el('qr'), el('playlist-qr')]) { img.hidden = true; img.removeAttribute('src'); }
      el('playlist-copy').hidden = true;
      qr.onload = () => { qr.hidden = false; if (over) el('playlist-copy').hidden = false; };
      qr.onerror = () => { qr.hidden = true; };
      // The playlist code only when the host chose QR code.
      if (!over) qr.src = hub + '/embed/join-qr.svg?t=' + Date.now();
      else if (s.playlist === 'qr') qr.src = hub + '/embed/playlist-qr.svg?t=' + Date.now();
    }
    arrange();
  }

  // --------------------------------------------------------- Roon Display
  // Added once a screen is wide enough, so a phone doesn't appear in Roon's
  // Displays, and never reloaded with each update. Sandboxed: Roon's page runs
  // its scripts and keeps its storage (its zone), but can't move this page away.
  const wide = window.matchMedia('(min-width: 721px)');
  let reachable = false;
  let loaded = false;
  function showFrame() {
    const box = el('frame-box');
    if (box.firstChild || !reachable) return;
    const frame = document.createElement('iframe');
    frame.className = 'frame';
    frame.title = 'Roon Display';
    frame.setAttribute('sandbox', 'allow-scripts allow-same-origin');
    frame.referrerPolicy = 'no-referrer';
    frame.addEventListener('load', () => { loaded = true; arrange(); });
    frame.src = display;
    box.appendChild(frame);
  }
  // Whether the Core answers: a frame shows a browser's error page just as
  // well, so it's asked first (no-cors: the answer can't be read, only that it came).
  async function probe() {
    try {
      await fetch(display, { mode: 'no-cors', cache: 'no-store' });
      reachable = true;
      arrange();
    } catch (err) {
      setTimeout(probe, 30000);
    }
  }

  // The frame, or what's playing until it has loaded and on a phone; "Requests
  // are closed" in their place with Party Off.
  function arrange() {
    const over = party === 'off';
    if (wide.matches) showFrame();
    const framed = !over && wide.matches && loaded;
    el('closed').hidden = !over;
    el('frame-slot').hidden = !framed;
    el('current').hidden = over || framed;
    document.querySelector('.stage').classList.toggle('framed', framed);
    alignArt();
  }
  wide.addEventListener('change', arrange);

  // ---------------------------------------------------------- playing now
  // The cover's top level with the middle of the "Playing now" line, its bottom
  // with the middle of the album line (as the built-in Hub does).
  function alignArt() {
    const image = el('current-art');
    image.style.width = image.style.height = image.style.marginTop = '';
    if (!wide.matches || el('current').hidden) return;
    const album = el('current-album');
    const added = album.hidden;
    if (added) { album.textContent = ' '; album.hidden = false; }
    const top = document.querySelector('.current-text').getBoundingClientRect().top;
    const middle = (line) => { const b = line.getBoundingClientRect(); return (b.top + b.bottom) / 2 - top; };
    const from = middle(el('current-label'));
    const size = middle(album) - from;
    if (added) { album.textContent = ''; album.hidden = true; }
    image.style.marginTop = from + 'px';
    image.style.width = image.style.height = size + 'px';
  }
  window.addEventListener('resize', alignArt);

  function showNowPlaying(data) {
    const playing = data.track;
    el('current-title').textContent = playing ? playing.title : 'Nothing playing';
    el('current-artist').textContent = playing ? playing.artist : '';
    const album = el('current-album');
    album.textContent = (playing && playing.album) || '';
    album.hidden = !album.textContent;
    // Beside what's playing, and above Roon's page.
    for (const id of ['current-who', 'frame-who']) {
      const who = el(id);
      who.hidden = !(playing && playing.credit);
      who.textContent = who.hidden ? '' : credit(playing.credit, true);
      who.className = 'current-who' + (who.hidden ? '' : ' who ' + creditClass(playing.credit));
    }
    el('current-label').textContent = el('frame-label').textContent =
      !playing || playing.state !== 'playing' ? 'Paused' : playing.station ? 'Radio station' : 'Playing now';
    el('current-note').hidden = el('frame-note').hidden = !(playing && playing.station) || party === 'paused';
    alignArt();
    const image = el('current-art');
    const drawn = image.getBoundingClientRect().width * (window.devicePixelRatio || 1);
    const src = playing && playing.art ? cover(playing.art, drawn > 400 ? 800 : 400) : '';
    if (!src) image.removeAttribute('src');
    else if (image.getAttribute('src') !== src) image.src = src;
  }

  // -------------------------------------------------------------- up next
  function showUpNext(data) {
    const list = el('list');
    list.textContent = '';
    if (!data.tracks.length) {
      const empty = document.createElement('li');
      empty.className = 'empty muted';
      empty.textContent = EMPTY[data.empty] || EMPTY.none;
      list.appendChild(empty);
    }
    data.tracks.forEach((track, index) => {
      const li = document.createElement('li');
      const n = document.createElement('span');
      n.className = 'n';
      n.textContent = String(index + 1);
      n.setAttribute('aria-hidden', 'true');
      const art = document.createElement('img');
      art.className = 'art cover';
      art.alt = '';
      art.loading = 'lazy';
      if (track.art) art.src = cover(track.art, 120);
      const wrap = document.createElement('div');
      const title = document.createElement('div');
      title.className = 't';
      title.textContent = track.title; // textContent: titles and names are never HTML
      const artist = document.createElement('div');
      artist.className = 'a';
      artist.textContent = track.artist;
      wrap.append(title, artist);
      if (track.credit) {
        const who = document.createElement('span');
        who.className = ('who ' + creditClass(track.credit)).trim();
        who.textContent = credit(track.credit, false);
        wrap.appendChild(who);
      }
      li.append(n, art, wrap);
      list.appendChild(li);
    });
    fitRows();
  }

  // Up next shows as many whole tracks as fit, never part of one; a phone
  // scrolls the page instead, and shows them all.
  function fitRows() {
    const rows = [...el('list').children];
    for (const row of rows) row.hidden = false;
    if (!wide.matches) return;
    const bottom = el('list').getBoundingClientRect().bottom;
    for (const row of rows) row.hidden = row.getBoundingClientRect().bottom > bottom + 0.5;
  }
  // Again whenever the list's room changes: the window, the code above it loading.
  if ('ResizeObserver' in window) new ResizeObserver(fitRows).observe(el('list'));
  else window.addEventListener('resize', fitRows);

  // ------------------------------------------------- keeping up to date
  const views = { status: showStatus, 'now-playing': showNowPlaying, 'up-next': showUpNext };
  let poller = null;
  async function pollOnce() {
    try {
      for (const [view, show] of Object.entries(views)) show(await (await fetch(hub + '/embed/' + view + '.json')).json());
      el('offline').hidden = true;
    } catch (err) {
      el('offline').textContent = "Can't reach Party Mode at " + hub;
      el('offline').hidden = false;
    }
  }
  function follow() {
    const source = new EventSource(hub + '/embed/events');
    for (const [event, show] of Object.entries(views)) source.addEventListener(event, (e) => show(JSON.parse(e.data)));
    source.onopen = () => { el('offline').hidden = true; clearInterval(poller); poller = null; };
    // EventSource reconnects by itself; meanwhile, fetch every 5 seconds.
    source.onerror = () => { if (!poller) { pollOnce(); poller = setInterval(pollOnce, 5000); } };
  }

  function start(address, core) {
    try {
      hub = new URL(address).origin;
      display = new URL(core).origin + '/display/';
    } catch (err) { return false; }
    // Links to join and to the playlist: the same addresses the codes carry.
    el('join-copy').href = hub + '/GuestHub';
    for (const id of ['playlist-qr-link', 'playlist-link-offer']) el(id).href = hub + '/Playlist';
    el('setup').hidden = true;
    follow();
    probe();
    return true;
  }
  el('setup-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const url = new URL(location.href);
    url.searchParams.set('hub', el('hub').value.trim());
    url.searchParams.set('roon', el('roon').value.trim());
    history.replaceState(null, '', url);
    start(el('hub').value.trim(), el('roon').value.trim());
  });
  const params = new URLSearchParams(location.search);
  el('hub').value = params.get('hub') || '';
  el('roon').value = params.get('roon') || '';
  if (!start(el('hub').value, el('roon').value)) el('setup').hidden = false;
})();

// Long names scroll: pause, slide to show the end, slide back, twice, then stop
// with the "…" back. From Party Mode's marquee.js.
(function () {
  'use strict';
  const SPEED = 40;
  const selectors = '.current-title, .current-artist, .current-album, .list .t, .list .a';
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const started = new Map();
  const finished = new Set();
  function unwrap(target) {
    const inner = target.querySelector(':scope > .marquee-inner');
    if (!inner) return;
    target.append(...inner.childNodes);
    inner.remove();
    target.classList.remove('marquee-on');
  }
  function apply(target) {
    let inner = target.querySelector(':scope > .marquee-inner');
    if (inner && target.childNodes.length !== 1) { unwrap(target); inner = null; }
    if (inner || finished.has(target.textContent) || target.scrollWidth <= target.clientWidth + 1) return;
    inner = document.createElement('span');
    inner.className = 'marquee-inner';
    inner.append(...target.childNodes);
    target.appendChild(inner);
    const shift = inner.scrollWidth - target.clientWidth;
    if (shift <= 1) { unwrap(target); return; }
    const seconds = Math.max(4, shift / SPEED / 0.7);
    const text = target.textContent;
    if (!started.has(text)) started.set(text, performance.now());
    const elapsed = (performance.now() - started.get(text)) / 1000;
    inner.style.setProperty('--marquee-shift', -shift + 'px');
    inner.style.setProperty('--marquee-time', seconds.toFixed(2) + 's');
    inner.style.animationDelay = -elapsed.toFixed(2) + 's';
    inner.addEventListener('animationend', () => { finished.add(text); unwrap(target); });
    target.classList.add('marquee-on');
  }
  let scheduled = false;
  function scan() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      const targets = document.querySelectorAll(selectors);
      targets.forEach(apply);
      const shown = new Set([...targets].map((t) => t.textContent));
      for (const text of started.keys()) if (!shown.has(text)) started.delete(text);
      for (const text of finished) if (!shown.has(text)) finished.delete(text);
    });
  }
  new MutationObserver(scan).observe(document.body, { childList: true, subtree: true, characterData: true });
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { document.querySelectorAll(selectors).forEach(unwrap); scan(); }, 150);
  });
  scan();
})();
</script>
