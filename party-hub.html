<!--
  The Party Hub, rebuilt from Party Mode's /embed/ addresses: the same layout,
  in English only. A starting point for a Party Hub of your own.

  Open this file in a browser (from any web server, or from disk) with the
  your Party Mode address added:
  party-hub.html?hub=http://192.0.2.10:8338

  Keeping it on a server of your own? Put your Party Mode address in HUB, in
  "Your addresses" just below, and the page needs nothing after the "?".

  In Firefox, open it from a web server rather than from disk: Firefox moves a
  page from disk's images to https, which Party Mode doesn't serve.

  What differs from the built-in Hub: there's no menu.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<script>
  // ---------------------------------------------- Your addresses: fill in
  // Your Party Mode address: where your Party Hub is, without /PartyHub.
  // Filled in, this page opens with nothing added to its own address; left
  // '', it asks for it. ?hub= in this page's address always wins.
  const HUB = ''; // such as 'http://192.0.2.10:8338'
</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Party Hub</title>
<style>
  /* From Party Mode's party.css and hub.css. */
  :root {
    --ink: #170f2b; --raised: #241740; --edge: #3a2a63; --text: #f0eaff; --muted: #a79bd0;
    --amber: #ffc24b; --lavender: #c9b6ff; --mint: #7be0c0; --sky: #8ccfff;
    --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  /* No CSS newer than Chromium 79 (TVs' built-in browsers, such as LG's from 2021): no gap in a flex
     row, no inset or padding-inline shorthands. */
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%;
    /* Laid out for 1920 × 1080, and the same on any shape as on a 4:3 screen of the same height: a wider one only
       adds space. --w is 1% of the width, at most 1% of that 4:3 width. A bigger screen grows everything with it.
       --vh is 1% of the height the page really has (the script measures it). */
    --vh: 1vh; --w: min(1vw, 4 * var(--vh) / 3);
    font-size: max(100%, min(100 * var(--vh) / 67.5, 100vw / 90)); }
  html, body { margin: 0; padding: 0; }
  body { background: var(--ink); color: var(--text); font-family: var(--font); line-height: 1.45;
    -webkit-font-smoothing: antialiased; min-height: calc(100 * var(--vh)); overflow: hidden; height: calc(100 * var(--vh)); font-size: 1.0625rem; }
  [hidden] { display: none !important; }
  .art { background: var(--edge); border-radius: 6px; object-fit: cover; flex: none; }
  .muted { color: var(--muted); }

  /* What's playing and the queue: their 4:3 width, plus 5/12 of any width beyond that up to 16:9 and 3/4 of any beyond
     (at most 1.6 times the height). The join code's column is no wider than the code. What's left over is shared
     evenly, either side of the columns and between them. */
  .stage { display: grid; grid-template-columns: minmax(17.5rem, calc(60 * var(--vh))) min(
      77 * var(--vh) + min(max(0px, 100vw - 400 * var(--vh) / 3), 400 * var(--vh) / 9) * 5 / 12 + max(0px, 100vw - 1600 * var(--vh) / 9) * 3 / 4,
      160 * var(--vh), 64%, calc(100% - 17.5rem - clamp(1.5rem, calc(4 * var(--w)), 4rem)));
    justify-content: space-evenly; grid-template-rows: auto minmax(0, 1fr);
    gap: clamp(1rem, 3 * var(--vh), 2.5rem) clamp(1.5rem, calc(4 * var(--w)), 4rem); height: calc(100 * var(--vh));
    padding: clamp(1.5rem, 5 * var(--vh), 4.5rem) clamp(1.5rem, 4 * var(--vh), 3.5rem); align-items: center; }
  .join { grid-row: 1 / -1; align-self: stretch; display: flex; flex-direction: column; justify-content: center; text-align: center; }
  .join h1 { margin: 0 0 1.2rem; padding-inline-start: 1.5rem; padding-inline-end: 1.5rem; font-size: clamp(1.6rem, calc(3 * var(--w)), 2.6rem); font-weight: 800; letter-spacing: -0.03em; }
  /* Up to 60% of the screen's height, leaving room for a long party name. */
  .qr { width: min(100%, 60 * var(--vh)); aspect-ratio: 1; background: #fff; border-radius: 18px; padding: 0.75rem; margin: 0 auto; display: block; }
  .join-copy { margin: 1rem 0 0.2rem; font-size: clamp(1rem, calc(1.6 * var(--w)), 1.4rem); color: var(--amber); }
  .join-link { color: inherit; text-decoration: none; border-radius: 6px; }
  .join-link:hover { text-decoration: underline; }
  .download { display: inline-block; text-decoration: none; border-radius: 999px; font-weight: 650;
    font-size: clamp(1rem, calc(1.4 * var(--w)), 1.25rem); padding: 0.8rem 1.6rem; background: var(--amber); color: #2a1c00; }

  .stack { min-width: 0; display: flex; flex-direction: column; justify-content: center; gap: clamp(1rem, 3 * var(--vh), 2.5rem); }
  .closed-title { margin: 0; font-size: clamp(1.6rem, calc(4 * var(--w)), 3.4rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05; color: var(--amber); }
  .closed-text { margin: 0.4rem 0 1.2rem; font-size: clamp(1rem, calc(1.6 * var(--w)), 1.4rem); }
  /* Party Off: "Requests are closed" in place of what's playing and Up next, centred. */
  .stage.over .stack { text-align: center; }

  .current { display: flex; align-items: flex-start; min-width: 0; }
  .current-art { width: clamp(6rem, calc(13 * var(--w)), 12.5rem); height: clamp(6rem, calc(13 * var(--w)), 12.5rem); border-radius: 10px;
    margin-inline-end: clamp(1rem, calc(2 * var(--w)), 2rem);
    box-shadow: 0 0 5.6rem -1.25rem var(--amber); }
  /* The credit right after "Playing now"; the title under them, across the whole width. */
  .current-text { flex: 1 1 auto; min-width: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); column-gap: 1rem; }
  .current-text > * { grid-column: 1 / -1; }
  .current-text > .current-label { grid-column: 1; }
  .current-text > .current-who { grid-area: 1 / 2; justify-self: start; align-self: center; margin: 0 0 0.5rem; }
  .current-label { margin: 0 0 0.5rem; color: var(--amber); font-size: clamp(0.9rem, calc(1.4 * var(--w)), 1.3rem); }
  .current-title { margin: 0; font-size: clamp(1.25rem, calc(1.95 * var(--w)), 1.75rem); font-weight: 800; letter-spacing: -0.03em; line-height: 1.05;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .current-artist { margin: 0.6rem 0 0; font-size: clamp(1rem, calc(1.8 * var(--w)), 1.6rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .current-album { margin: 0.4rem 0 0; font-size: clamp(0.9rem, calc(1.5 * var(--w)), 1.3rem); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .current-note { margin: 0.6rem 0 0; font-size: clamp(0.9rem, calc(1.4 * var(--w)), 1.2rem); max-width: 40ch; }
  .current-who { display: inline-block; margin: 0.8rem 0 0; padding: 0.15rem 0.75rem; border-radius: 999px;
    font-size: clamp(0.8rem, calc(1.2 * var(--w)), 1.15rem); background: rgba(201, 182, 255, 0.18); color: var(--lavender); }

  .upnext { grid-column: 2; align-self: stretch; min-height: 0; display: flex; flex-direction: column; }
  .upnext-title { display: flex; justify-content: space-between; align-items: baseline; margin: 0 0 0.6rem; color: var(--amber); font-size: clamp(0.9rem, calc(1.4 * var(--w)), 1.3rem); font-weight: 600; }
  /* How many tracks are queued, when more than fit: across from the heading. */
  .upnext-count { margin-inline-start: 1rem; color: var(--muted); font-weight: 400; white-space: nowrap; }
  .list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--edge); min-width: 0; flex: 1 1 auto; min-height: 0; overflow: hidden; }
  .list .empty { display: flex; align-items: center; justify-content: center; height: 100%; border-bottom: 0; text-align: center;
    font-size: clamp(1rem, calc(1.8 * var(--w)), 1.6rem); }
  .list li { display: grid; grid-template-columns: auto 1fr; gap: 1rem; align-items: center;
    padding: clamp(0.4rem, 1.1 * var(--vh), 0.9rem) 0; border-bottom: 1px solid rgba(58, 42, 99, 0.5); font-size: clamp(1rem, calc(1.6 * var(--w)), 1.5rem); min-width: 0; }
  /* Only whole tracks (see the script): a screen can't scroll. */
  .list li[hidden] { display: none; }
  .list .cover { width: 2.4em; height: 2.4em; }
  .list > li > div { min-width: 0; }
  .list .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .list .a { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: 0.78em; }
  .list .who { display: inline-block; max-width: 100%; margin-top: 0.3rem; padding: 0.1rem 0.6rem; border-radius: 999px; font-size: 0.6em;
    background: rgba(201, 182, 255, 0.18); color: var(--lavender); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Lavender for a track a guest added, amber for Play next, mint for Roon Radio, sky for the host's. */
  .who.radio { background: rgba(123, 224, 192, 0.16); color: var(--mint); }
  .who.next { background: rgba(255, 194, 75, 0.16); color: var(--amber); }
  .who.host { background: rgba(140, 207, 255, 0.16); color: var(--sky); }

  @media (min-width: 721px) {
    /* The credit at the row's far end, level with title and artist. */
    .list > li > div { display: grid; grid-template-columns: minmax(0, 1fr) max-content; align-items: center; column-gap: 1.5em; }
    .list .t { grid-area: 1 / 1; }
    .list .a { grid-area: 2 / 1; }
    .list .who { grid-area: 1 / 2 / span 2; justify-self: end; margin-top: 0; }
    /* The room under the last whole track, shared above and below (see the script). */
    .stage:not(.over) .stack, .stage:not(.over) .upnext { transform: translateY(var(--shift, 0px)); }
    .stage.over .stack { grid-row: 1 / -1; align-self: center; }
  }
  @media (max-width: 720px) {
    body { overflow: auto; height: auto; }
    .stage { grid-template-columns: 1fr; grid-template-rows: none; height: auto; align-content: start; }
    .join { grid-row: auto; display: block; }
    .upnext { grid-column: auto; }
    .list { overflow: visible; }
    .current { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 1rem; align-items: center; }
    .current-text { display: contents; }
    .current-text > .current-label { grid-area: 1 / 1 / auto / -1; margin: 0 0 0.6rem; font-weight: 600; }
    .current-art { margin-inline-end: 0; grid-column: 1; grid-row: 2 / span 3; }
    .current-text > .current-title { grid-area: 2 / 2; font-size: 1.6rem; }
    .current-artist { grid-area: 3 / 2; }
    .current-album { grid-area: 4 / 2; }
    .current-text > .current-who { grid-area: 1 / 2; justify-self: end; align-self: start; }
    .qr { width: min(60%, 16rem); }
  }

  /* Long names scroll, twice, then stop (see the script). */
  .marquee-on { text-overflow: clip; }
  .marquee-inner { display: inline-block; animation: marquee var(--marquee-time, 8s) ease-in-out 4 alternate; }
  @keyframes marquee { 0%, 15% { transform: translateX(0); } 85%, 100% { transform: translateX(var(--marquee-shift, 0)); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

  /* Only until an address is given. */
  .setup { position: fixed; top: 0; right: 0; bottom: 0; left: 0; display: grid; place-items: center; background: var(--ink); padding: 16px; }
  .setup form { display: flex; width: min(36rem, 100%); }
  .setup input { flex: 1; min-width: 0; padding: 0.6rem; font: inherit; border-radius: 8px; border: 1px solid var(--edge); }
  .setup button { margin-inline-start: 8px; padding: 0.6rem 1.2rem; font: inherit; font-weight: 650; border: 0; border-radius: 999px; background: var(--amber); color: #2a1c00; cursor: pointer; }
  .offline { position: fixed; bottom: 0.5rem; left: 0.75rem; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
<div class="setup" id="setup" hidden>
  <form id="setup-form">
    <input id="hub" type="url" placeholder="http://192.0.2.10:8338" aria-label="Your Party Mode address" required>
    <button>Show</button>
  </form>
</div>

<main class="stage">
  <section class="join">
    <h1 id="party-name">Party</h1>
    <div id="join-open">
      <img id="qr" class="qr" alt="QR code for the guest page" hidden>
      <p class="join-copy"><a class="join-link" id="join-copy" target="_blank" rel="noopener">Scan to add a track</a></p>
    </div>
    <div id="join-closed" hidden>
      <img id="playlist-qr" class="qr" alt="QR code for the playlist" hidden>
      <p class="join-copy" id="playlist-copy" hidden><a class="join-link" id="playlist-qr-link">Scan to download the playlist</a></p>
      <a class="download" id="playlist-link-offer" hidden>Download the playlist</a>
    </div>
  </section>

  <section class="stack">
    <div id="closed" hidden>
      <h2 class="closed-title">Requests are closed</h2>
      <p class="closed-text muted">Thanks for all the tracks.</p>
    </div>
    <div class="current" id="current">
      <img class="art current-art" id="current-art" alt="">
      <div class="current-text">
        <p class="current-label" id="current-label">Playing now</p>
        <h2 class="current-title" id="current-title">Nothing playing</h2>
        <p class="current-artist muted" id="current-artist"></p>
        <p class="current-album muted" id="current-album" hidden></p>
        <p class="current-who" id="current-who" hidden></p>
        <p class="current-note muted" id="current-note" hidden>Waiting for the host to start the queue.</p>
      </div>
    </div>
  </section>

  <section class="upnext">
    <h2 class="upnext-title"><span>Up next</span><span class="upnext-count" id="upnext-count" hidden></span></h2>
    <ol class="list" id="list"></ol>
  </section>
</main>
<p class="offline" id="offline" hidden></p>

<script>
(function () {
  'use strict';
  const el = (id) => document.getElementById(id);
  let hub = null; // "http://192.0.2.10:8338"

  // 1% of the height the page really has, for --vh: an iPad's Safari counts
  // its tab and address bars in 100vh, which cut the page off.
  function measureHeight() {
    document.documentElement.style.setProperty('--vh', window.innerHeight / 100 + 'px');
  }
  measureHeight();
  window.addEventListener('resize', measureHeight);

  // ------------------------------------------------------------ the words
  // The built-in Hub's English. /embed/ gives kinds and reasons; the page words them.
  let hostName = null;
  const EMPTY = {
    none: 'Nothing lined up.',
    add: 'Nothing lined up. Add a track.',
    add_radio: 'Nothing lined up. Add a track, or leave it to Roon Radio.',
    radio: "Roon Radio picks what's next."
  };
  // In Up next: the name alone; beside the playing track: "Requested by …".
  function credit(c, long) {
    if (c.kind === 'radio') return 'Roon Radio';
    if (c.kind === 'host') return c.name || hostName || 'Host';
    const name = c.name || 'Anon';
    return long ? 'Requested by ' + name : name;
  }
  // Lavender for a guest's track, amber for Play next, mint for Roon Radio, sky for the host's.
  const creditClass = (c) => (c.kind === 'guest' ? (c.how === 'next' ? 'next' : '') : c.kind);
  const cover = (path, size) => (path ? hub + path + '?size=' + size : '');

  // --------------------------------------------------------------- status
  let party = null;
  function showStatus(s) {
    hostName = s.host_name;
    const name = s.party_name || 'Party';
    el('party-name').textContent = name;
    document.title = name + ' Hub';
    const over = s.party === 'off';
    el('join-open').hidden = over;
    el('join-closed').hidden = !over;
    fitQr();
    el('closed').hidden = !over;
    el('current').hidden = over;
    document.querySelector('.upnext').hidden = over;
    document.querySelector('.stage').classList.toggle('over', over);
    el('join-copy').textContent = s.party === 'paused' ? 'Requests are paused for a moment.' : 'Scan to add a track';
    // With a link chosen, a button in the code's place.
    el('playlist-link-offer').hidden = !(over && s.playlist === 'link');
    if (s.party !== party) {
      party = s.party;
      // Loaded again with each change: a new party has a new code. Shown only once
      // loaded, as a cleared src can leave the last picture showing.
      const qr = over ? el('playlist-qr') : el('qr');
      for (const img of [el('qr'), el('playlist-qr')]) { img.hidden = true; img.removeAttribute('src'); }
      el('playlist-copy').hidden = true;
      qr.onload = () => { qr.hidden = false; if (over) el('playlist-copy').hidden = false; };
      qr.onerror = () => { qr.hidden = true; };
      // The playlist code only when the host chose QR code.
      if (!over) qr.src = hub + '/embed/join-qr.svg?t=' + Date.now();
      else if (s.playlist === 'qr') qr.src = hub + '/embed/playlist-qr.svg?t=' + Date.now();
    }
  }

  // ---------------------------------------------------------- playing now
  // The cover's top level with the top of the "Playing now" line, its bottom
  // with the bottom of the album line (as the built-in Hub does).
  const wide = window.matchMedia('(min-width: 721px)');
  function alignArt() {
    const image = el('current-art');
    image.style.width = image.style.height = image.style.marginTop = '';
    if (!wide.matches || el('current').hidden) return;
    const album = el('current-album');
    const added = album.hidden;
    if (added) { album.textContent = ' '; album.hidden = false; }
    const top = document.querySelector('.current-text').getBoundingClientRect().top;
    const from = el('current-label').getBoundingClientRect().top - top;
    const size = album.getBoundingClientRect().bottom - top - from;
    if (added) { album.textContent = ''; album.hidden = true; }
    image.style.marginTop = from + 'px';
    image.style.width = image.style.height = size + 'px';
  }
  window.addEventListener('resize', alignArt);

  function showNowPlaying(data) {
    const playing = data.track;
    el('current-title').textContent = playing ? playing.title : 'Nothing playing';
    el('current-artist').textContent = playing ? playing.artist : '';
    const album = el('current-album');
    album.textContent = (playing && playing.album) || '';
    album.hidden = !album.textContent;
    const who = el('current-who');
    who.hidden = !(playing && playing.credit);
    who.textContent = who.hidden ? '' : credit(playing.credit, true);
    who.className = 'current-who' + (who.hidden ? '' : ' who ' + creditClass(playing.credit));
    el('current-label').textContent =
      !playing || playing.state !== 'playing' ? 'Paused' : playing.station ? 'Radio station' : 'Playing now';
    el('current-note').hidden = !(playing && playing.station) || party === 'paused';
    alignArt();
    const image = el('current-art');
    const drawn = image.getBoundingClientRect().width * (window.devicePixelRatio || 1);
    const src = playing && playing.art ? cover(playing.art, drawn > 400 ? 800 : 400) : '';
    if (!src) image.removeAttribute('src');
    else if (image.getAttribute('src') !== src) image.src = src;
  }

  // -------------------------------------------------------------- up next
  function showUpNext(data) {
    const list = el('list');
    list.textContent = '';
    if (!data.tracks.length) {
      const empty = document.createElement('li');
      empty.className = 'empty muted';
      empty.textContent = EMPTY[data.empty] || EMPTY.none;
      list.appendChild(empty);
    }
    queued = data.tracks.length;
    data.tracks.forEach((track) => {
      const li = document.createElement('li');
      const art = document.createElement('img');
      art.className = 'art cover';
      art.alt = '';
      art.loading = 'lazy';
      if (track.art) art.src = cover(track.art, 120);
      const wrap = document.createElement('div');
      const title = document.createElement('div');
      title.className = 't';
      title.textContent = track.title; // textContent: titles and names are never HTML
      const artist = document.createElement('div');
      artist.className = 'a';
      artist.textContent = track.artist;
      wrap.append(title, artist);
      if (track.credit) {
        const who = document.createElement('span');
        who.className = ('who ' + creditClass(track.credit)).trim();
        who.textContent = credit(track.credit, false);
        wrap.appendChild(who);
      }
      li.append(art, wrap);
      list.appendChild(li);
    });
    fitRows();
  }

  // Up next shows as many whole tracks as fit, never part of one; a phone
  // scrolls the page instead, and shows them all.
  // The room under the last whole one is shared above and below the
  // right-hand side (--shift), so it sits in the middle, as the code does.
  // How many tracks are queued: said across from Up next when more than fit.
  let queued = 0;
  function showCount(shown) {
    const count = el('upnext-count');
    count.hidden = queued <= shown;
    count.textContent = count.hidden ? '' : queued + (queued === 1 ? ' track' : ' tracks');
  }
  function fitRows() {
    const rows = [...el('list').children];
    const stage = document.querySelector('.stage');
    for (const row of rows) row.hidden = false;
    stage.style.setProperty('--shift', '0px');
    showCount(rows.length);
    if (!wide.matches) return;
    const bottom = el('list').getBoundingClientRect().bottom;
    for (const row of rows) row.hidden = row.getBoundingClientRect().bottom > bottom + 0.5;
    const shown = rows.filter((row) => !row.hidden);
    showCount(shown.length);
    if (shown.length < rows.length && shown.length) {
      const left = bottom - shown[shown.length - 1].getBoundingClientRect().bottom;
      stage.style.setProperty('--shift', Math.floor(left / 2) + 'px');
    }
  }
  // Again whenever the list's room changes: the window, the code above it loading.
  if ('ResizeObserver' in window) new ResizeObserver(fitRows).observe(el('list'));
  else window.addEventListener('resize', fitRows);

  // A long party name, over two or three lines, can leave less room than the
  // code's 60% of the height: then the code gives way, down to 10rem.
  function fitQr() {
    const join = document.querySelector('.join');
    const codes = [...join.querySelectorAll('.qr')];
    for (const code of codes) code.style.width = '';
    if (!wide.matches) return;
    const parts = [...join.children].filter((part) => !part.hidden);
    const over = parts[parts.length - 1].getBoundingClientRect().bottom - parts[0].getBoundingClientRect().top - join.clientHeight;
    if (over <= 0) return;
    const least = 10 * parseFloat(getComputedStyle(document.documentElement).fontSize);
    for (const code of codes) if (code.offsetParent) code.style.width = Math.max(code.offsetWidth - over, least) + 'px';
  }
  // Again when the room changes: the window, the name's lines, a code loading.
  if ('ResizeObserver' in window) {
    const watch = new ResizeObserver(fitQr);
    watch.observe(document.querySelector('.join'));
    watch.observe(el('party-name'));
  } else window.addEventListener('resize', fitQr);
  el('qr').addEventListener('load', fitQr);
  el('playlist-qr').addEventListener('load', fitQr);

  // And once the page has loaded: an iPad's Safari can report its height
  // before its bars settle, leaving the right-hand side too high.
  function relayout() {
    measureHeight();
    alignArt();
    fitRows();
    fitQr();
  }
  window.addEventListener('load', () => { relayout(); setTimeout(relayout, 500); });
  window.addEventListener('pageshow', relayout);

  // ------------------------------------------------- keeping up to date
  const views = { status: showStatus, 'now-playing': showNowPlaying, 'up-next': showUpNext };
  let poller = null;
  async function pollOnce() {
    try {
      for (const [view, show] of Object.entries(views)) show(await (await fetch(hub + '/embed/' + view + '.json')).json());
      el('offline').hidden = true;
    } catch (err) {
      el('offline').textContent = "Can't reach Party Mode at " + hub;
      el('offline').hidden = false;
    }
  }
  function follow() {
    const source = new EventSource(hub + '/embed/events');
    for (const [event, show] of Object.entries(views)) source.addEventListener(event, (e) => show(JSON.parse(e.data)));
    source.onopen = () => { el('offline').hidden = true; clearInterval(poller); poller = null; };
    // EventSource reconnects by itself; meanwhile, fetch every 5 seconds.
    source.onerror = () => { if (!poller) { pollOnce(); poller = setInterval(pollOnce, 5000); } };
  }

  function start(address) {
    try { hub = new URL(address).origin; } catch (err) { return false; }
    // Links to join and to the playlist: the same addresses the codes carry.
    el('join-copy').href = hub + '/GuestHub';
    for (const id of ['playlist-qr-link', 'playlist-link-offer']) el(id).href = hub + '/Playlist';
    el('setup').hidden = true;
    follow();
    return true;
  }
  el('setup-form').addEventListener('submit', (event) => {
    event.preventDefault();
    const url = new URL(location.href);
    url.searchParams.set('hub', el('hub').value.trim());
    history.replaceState(null, '', url);
    start(el('hub').value.trim());
  });
  const given = new URLSearchParams(location.search).get('hub') || HUB;
  if (given) el('hub').value = given;
  if (!given || !start(given)) el('setup').hidden = false;
})();

// Long names scroll: pause, slide to show the end, slide back, twice, then stop
// with the "…" back. From Party Mode's marquee.js.
(function () {
  'use strict';
  const SPEED = 40;
  const selectors = '.current-title, .current-artist, .current-album, .list .t, .list .a';
  if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const started = new Map();
  const finished = new Set();
  function unwrap(target) {
    const inner = target.querySelector(':scope > .marquee-inner');
    if (!inner) return;
    target.append(...inner.childNodes);
    inner.remove();
    target.classList.remove('marquee-on');
  }
  function apply(target) {
    let inner = target.querySelector(':scope > .marquee-inner');
    if (inner && target.childNodes.length !== 1) { unwrap(target); inner = null; }
    if (inner || finished.has(target.textContent) || target.scrollWidth <= target.clientWidth + 1) return;
    inner = document.createElement('span');
    inner.className = 'marquee-inner';
    inner.append(...target.childNodes);
    target.appendChild(inner);
    const shift = inner.scrollWidth - target.clientWidth;
    if (shift <= 1) { unwrap(target); return; }
    const seconds = Math.max(4, shift / SPEED / 0.7);
    const text = target.textContent;
    if (!started.has(text)) started.set(text, performance.now());
    const elapsed = (performance.now() - started.get(text)) / 1000;
    inner.style.setProperty('--marquee-shift', -shift + 'px');
    inner.style.setProperty('--marquee-time', seconds.toFixed(2) + 's');
    inner.style.animationDelay = -elapsed.toFixed(2) + 's';
    inner.addEventListener('animationend', () => { finished.add(text); unwrap(target); });
    target.classList.add('marquee-on');
  }
  let scheduled = false;
  function scan() {
    if (scheduled) return;
    scheduled = true;
    requestAnimationFrame(() => {
      scheduled = false;
      const targets = document.querySelectorAll(selectors);
      targets.forEach(apply);
      const shown = new Set([...targets].map((t) => t.textContent));
      for (const text of started.keys()) if (!shown.has(text)) started.delete(text);
      for (const text of finished) if (!shown.has(text)) finished.delete(text);
    });
  }
  new MutationObserver(scan).observe(document.body, { childList: true, subtree: true, characterData: true });
  let resizeTimer = null;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(() => { document.querySelectorAll(selectors).forEach(unwrap); scan(); }, 150);
  });
  scan();
})();
</script>
</body>
</html>
